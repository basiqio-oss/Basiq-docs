name: Broken Link Check

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'custom_pages/**'
      - 'custom_blocks/**'
      - 'recipes/**'
      - 'reference/**'
  pull_request:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Live site base URL to crawl (site-crawl job)'
        required: false
        default: 'https://api.basiq.io'

permissions:
  contents: read

# ── Job 1: check links in source files (fast, runs on every trigger) ─────────
jobs:
  check-files:
    name: Check Links in Source Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Restore lychee cache to avoid hammering external sites on every run
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lychee.cache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md', '**/*.mdx') }}
          restore-keys: lychee-${{ runner.os }}-

      - name: Install lychee
        run: |
          LYCHEE_VERSION="0.24.2"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --wildcards '*/lychee' --strip-components=1
          sudo mv lychee /usr/local/bin/lychee
          lychee --version

      - name: Check links
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Broken Link Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          set +e
          lychee \
            --cache \
            --cache-file "$GITHUB_WORKSPACE/.lychee.cache" \
            --max-cache-age 3d \
            --no-progress \
            --exclude-path node_modules \
            --exclude-path .git \
            --exclude 'localhost' \
            --exclude 'example\.com' \
            --exclude '127\.0\.0\.1' \
            --exclude 'your-domain\.com' \
            --timeout 30 \
            --max-retries 3 \
            --retry-wait-time 5 \
            --accept 200,204,206,301,302,307,308,403,429 \
            --format markdown \
            './**/*.md' './**/*.mdx' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          EXIT=${PIPESTATUS[0]}
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Exit code:** \`$EXIT\` (0 = all good, 2 = broken links found)" >> $GITHUB_STEP_SUMMARY
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT

# ── Job 2: crawl the live published website (always runs) ─────────────────────
  check-site:
    name: Crawl Live Site for Broken Links
    runs-on: ubuntu-24.04

    steps:
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.lychee-site.cache
          key: lychee-site-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lychee-site-${{ runner.os }}-

      - name: Install lychee
        run: |
          LYCHEE_VERSION="0.24.2"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --wildcards '*/lychee' --strip-components=1
          sudo mv lychee /usr/local/bin/lychee
          lychee --version

      - name: Crawl live site via sitemap
        id: crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE_URL="${{ github.event.inputs.site_url || 'https://api.basiq.io' }}"
          SITEMAP_URL="${SITE_URL%/}/sitemap.xml"

          echo "Crawling: $SITE_URL"
          echo "Sitemap:  $SITEMAP_URL"

          # Try sitemap first; fall back to root URL if sitemap returns non-2xx
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$SITEMAP_URL")
          if [[ "$HTTP_STATUS" == 2* ]]; then
            echo "Using sitemap: $SITEMAP_URL"
            INPUT_URL="$SITEMAP_URL"
          else
            echo "No sitemap found (HTTP $HTTP_STATUS), crawling root URL instead"
            INPUT_URL="$SITE_URL"
          fi

          echo "## Live Site Broken Link Report" >> $GITHUB_STEP_SUMMARY
          echo "_Crawled: \`${INPUT_URL}\`_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          set +e
          lychee \
            --cache \
            --cache-file "$GITHUB_WORKSPACE/.lychee-site.cache" \
            --max-cache-age 3d \
            --no-progress \
            --exclude 'localhost' \
            --exclude '127\.0\.0\.1' \
            --timeout 30 \
            --max-retries 3 \
            --retry-wait-time 5 \
            --accept 200,204,206,301,302,307,308,403,429 \
            --format markdown \
            "$INPUT_URL" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          EXIT=${PIPESTATUS[0]}
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Exit code:** \`$EXIT\` (0 = all good, 2 = broken links found)" >> $GITHUB_STEP_SUMMARY
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
