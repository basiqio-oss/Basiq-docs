name: ReadMe API Reference Sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install rdme CLI v10
        run: npm install -g rdme@10

      - name: Validate API definitions
        run: |
          rdme openapi validate ./reference/connect.json
          rdme openapi validate ./reference/enrich.json
          rdme openapi validate ./reference/reporting.json
          rdme openapi validate ./reference/platform.json
          rdme openapi validate ./reference/insights.json
          rdme openapi validate ./reference/analytics.json
          rdme openapi validate ./reference/payees.json
          rdme openapi validate ./reference/webhooks.json

      - name: Upload API definitions
        run: |
          rdme openapi upload ./reference/connect.json --slug=connect --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/enrich.json --slug=enrich --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/reporting.json --slug=reports --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/platform.json --slug=platform --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/insights.json --slug=insights --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/analytics.json --slug=analytics --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/payees.json --slug=payees --key=${{ secrets.README_API_KEY }}
          rdme openapi upload ./reference/webhooks.json --slug=webhooks --key=${{ secrets.README_API_KEY }}
          