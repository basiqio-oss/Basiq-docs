name: ReadMe API Reference Sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install rdme CLI v10
        run: npm install -g rdme@10

      - name: Validate API definition
        run: |
          rdme openapi validate ./reference/core.json 

      - name: Upload API definition
        run: |
          rdme openapi upload ./reference/core.json --slug=core --key=${{ secrets.README_API_KEY_DEMO_PROJECT }}
